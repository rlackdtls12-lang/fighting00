<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 응원 한마디</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6a5b;
      --accent: #ff7a45;
      --accent-press: #e8612c;
      --border: #f0dcc6;
      --error-bg: #fff0ee;
      --error-text: #b3261e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1814;
        --card: #2a231d;
        --text: #f7efe6;
        --muted: #b9a998;
        --accent: #ff8a5b;
        --accent-press: #ff7a45;
        --border: #43382e;
        --error-bg: #3a211f;
        --error-text: #ffb4ab;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 20px;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.25;
      text-align: center;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 16px;
      font: inherit;
      font-size: 1.25rem;
      color: var(--text);
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .hint {
      margin: 8px 0 20px;
      font-size: 1rem;
      color: var(--muted);
    }

    button {
      width: 100%;
      min-height: 64px;
      padding: 16px;
      font: inherit;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }

    button:active { background: var(--accent-press); }

    button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    #result {
      margin-top: 24px;
      min-height: 140px;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.5;
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: anywhere;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
    }

    #result[data-state="idle"],
    #result[data-state="loading"] {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--muted);
    }

    #result[data-state="error"] {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--error-text);
      background: var(--error-bg);
      border-color: var(--error-text);
    }
  </style>
</head>
<body>
  <main>
    <h1>오늘의 응원 한마디</h1>
    <p class="lead">닉네임을 적고 응원을 받아 보세요.</p>

    <form id="cheer-form">
      <label for="name">공개용 닉네임</label>
      <input id="name" name="name" type="text" maxlength="20"
             placeholder="예: 햇살" autocomplete="off" enterkeyhint="go">
      <p class="hint">비워 두면 "여러분"으로 불러 드려요.</p>
      <button id="submit" type="submit">응원 받기</button>
    </form>

    <div id="result" data-state="idle" role="status" aria-live="polite">
      버튼을 누르면 여기에 응원이 나타나요.
    </div>
  </main>

  <script>
    const form = document.getElementById("cheer-form");
    const nameInput = document.getElementById("name");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");

    const TIMEOUT_MS = 8000;

    function show(state, text) {
      result.dataset.state = state;
      result.textContent = text;
    }

    function failureText(reason) {
      return "응원을 불러오지 못했어요. (" + reason + ")\n잠시 후 다시 시도해 주세요.";
    }

    async function requestCheer() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

      button.disabled = true;
      show("loading", "응원을 불러오는 중이에요…");

      try {
        // 상대 경로로 요청해서 Pages와 Vercel에서 같은 코드가 그대로 동작합니다.
        const query = new URLSearchParams({ name: nameInput.value.trim() });
        const response = await fetch("api/message?" + query, {
          cache: "no-store",
          signal: controller.signal,
        });

        if (!response.ok) {
          throw new Error("서버 응답 " + response.status);
        }

        const data = await response.json().catch(() => {
          throw new Error("응답 형식 오류");
        });

        if (typeof data.message !== "string" || !data.message) {
          throw new Error("응답에 문장이 없음");
        }

        show("done", data.message);
      } catch (error) {
        const reason = error.name === "AbortError"
          ? "응답 시간 초과"
          : error instanceof TypeError
            ? "서버에 연결할 수 없음"
            : error.message;
        show("error", failureText(reason));
      } finally {
        clearTimeout(timer);
        button.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      requestCheer();
    });
  </script>
</body>
</html>
